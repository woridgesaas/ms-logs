services:
  woridge.ms-logs.loki:
    image: grafana/loki:latest
    container_name: woridge-loki
    user: "0:0"
    volumes:
      - ./config/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/tmp/loki
    ports:
      - "3100:3100"
    networks:
      - woridge-external-network
    restart: always
  
  woridge.ms-logs.promtail:
    image: grafana/promtail:latest
    container_name: woridge-promtail
    volumes:
      - ./config/promtail-config.yaml:/etc/promtail/config.yml
      # Named Volume
      - ms-auth_logs:/var/logs/auth:ro
      - ms-planification-entretiens_logs:/var/logs/Rh-extern/planification:ro
      - ms-gestion-offre_logs:/var/logs/Rh-extern/offres:ro
      - ms-canal-diffusion_logs:/var/logs/Rh-extern/diffusionCanal:ro
    networks:
      - woridge-external-network
    depends_on:
      - woridge.ms-logs.loki
    restart: always
    
networks:
  woridge-external-network:
    external: true

volumes:
  loki_data:
  ms-auth_logs:
    external: true
    name: ms-auth_logs
    
  ms-planification-entretiens_logs:
    external: true
    name: ms-planification-entretiens_logs

  ms-gestion-offre_logs:
    external: true      
    name: ms-gestion-offre_logs

  ms-canal-diffusion_logs:
    external: true
    name: ms-canal-diffusion_logs